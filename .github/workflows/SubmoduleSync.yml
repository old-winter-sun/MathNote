name: CI

on:
  push:
    branches: 
      - main

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with: 
          repository: old-winter-sun/wsBlogSource
          token: ${{ secrets.MATHNOTE_DEPLOY_PRI }}

      - name: Init git
        run: |
          git config user.email "none"
          git config user.name "Submodule Sync Bot"

      - name: Submodule update
        run: |
          git submodule update --init --recursive source/_posts/MathNote/
          git submodule update --recursive --remote source/_posts/MathNote/

      - name: Commit to parent repo
        run: |
          git add --all
          git commit -m "Sync MathNote Submodule"
          git push
